<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ORYX.OS | Secure Gateway</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg-dark: #050507;
  --panel-bg: #0c0c12;
  --neon-cyan: #00f0ff;
  --neon-purple: #7a5cff;
  --neon-pink: #ff2fd1;
  --border: rgba(255, 255, 255, 0.08);
  --text-dim: rgba(255, 255, 255, 0.5);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Montserrat', sans-serif;
  background-color: var(--bg-dark);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  overflow: hidden;
}

/* Background glowing grids */
body::before {
  content: '';
  position: absolute;
  width: 150%;
  height: 150%;
  background-image: 
    radial-gradient(circle at 20% 30%, rgba(122, 92, 255, 0.07) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(0, 240, 255, 0.07) 0%, transparent 40%);
  z-index: 1;
}

.login-container {
  position: relative;
  width: 100%;
  max-width: 400px;
  background: var(--panel-bg);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 40px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
  z-index: 2;
}

.brand-area {
  margin-bottom: 35px;
}

.brand-area h2 {
  font-size: 22px;
  letter-spacing: 6px;
  font-weight: 800;
  text-transform: uppercase;
  margin-bottom: 6px;
  background: linear-gradient(135deg, #fff, var(--text-dim));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.brand-area p {
  font-size: 9px;
  color: var(--neon-cyan);
  letter-spacing: 2px;
  text-transform: uppercase;
  font-weight: 600;
}

.input-group {
  margin-bottom: 18px;
  text-align: left;
}

.input-group label {
  display: block;
  font-size: 9px;
  letter-spacing: 1.5px;
  color: var(--text-dim);
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 8px;
  padding-left: 4px;
}

.input-field {
  width: 100%;
  padding: 16px;
  border-radius: 12px;
  background: rgba(5, 5, 7, 0.8);
  border: 1px solid var(--border);
  color: white;
  outline: none;
  font-family: 'Montserrat', sans-serif;
  font-size: 13px;
  transition: 0.3s;
}

.input-field:focus {
  border-color: var(--neon-cyan);
  box-shadow: 0 0 10px rgba(0, 240, 255, 0.15);
}

.btn-authenticate {
  position: relative;
  width: 100%;
  padding: 18px;
  border-radius: 12px;
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  font-size: 11px;
  letter-spacing: 2px;
  cursor: pointer;
  background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink));
  border: none;
  color: white;
  margin-top: 10px;
  transition: 0.3s;
  text-transform: uppercase;
}

.btn-authenticate:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 20px rgba(122, 92, 255, 0.4);
}

.btn-authenticate:active {
  transform: translateY(0);
}

.error-message {
  color: #ff4d4d;
  font-size: 11px;
  margin-top: 15px;
  font-weight: 600;
  letter-spacing: 0.5px;
  display: none;
}
</style>
</head>
<body>

<div class="login-container">
  <div class="brand-area">
    <h2>ORYX.OS™</h2>
    <p>SECURE PORTAL LOGIN</p>
  </div>

  <form id="loginForm">
    <div class="input-group">
      <label for="email">Staff Terminal ID</label>
      <input type="email" id="email" class="input-field" placeholder="venue@oryx.os" required>
    </div>

    <div class="input-group">
      <label for="password">Security Protocol key</label>
      <input type="password" id="password" class="input-field" placeholder="••••••••••••" required>
    </div>

    <button type="submit" class="btn-authenticate" id="submitBtn">AUTHENTICATE</button>
  </form>

  <div id="errorMsg" class="error-message">ACCESS DENIED: INVALID TERMINAL KEY</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
// Initialize Firebase
firebase.initializeApp({
  apiKey: "AIzaSyCRzE9DheGAxan7h2NLB14Va3hI4Pc5EKM",
  authDomain: "aryauxsongrequest.firebaseapp.com",
  databaseURL: "https://aryauxsongrequest-default-rtdb.firebaseio.com",
  projectId: "aryauxsongrequest",
  storageBucket: "aryauxsongrequest.appspot.com",
  messagingSenderId: "376455919089",
  appId: "1:376455919089:web:4962df21f4145b61c30050"
});

const auth = firebase.auth();
const loginForm = document.getElementById('loginForm');
const errorMsg = document.getElementById('errorMsg');
const submitBtn = document.getElementById('submitBtn');

// If already authenticated, bypass login page immediately and head to admin dashboard
auth.onAuthStateChanged(user => {
  if (user) {
    window.location.href = "admin.html";
  }
});

// Handle login attempt
loginForm.addEventListener('submit', (e) => {
  e.preventDefault();
  
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  
  submitBtn.innerText = "VERIFYING...";
  submitBtn.disabled = true;
  errorMsg.style.display = "none";

  auth.signInWithEmailAndPassword(email, password)
    .then(() => {
      // Successful auth triggers onAuthStateChanged above, sending them to admin.html
    })
    .catch((error) => {
      console.error(error);
      errorMsg.style.display = "block";
      submitBtn.innerText = "AUTHENTICATE";
      submitBtn.disabled = false;
    });
});
</script>

</body>
</html>
