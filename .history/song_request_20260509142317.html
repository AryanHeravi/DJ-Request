<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>ORYX.OS | Request</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg-dark: #050507;
  --neon-purple: #7a5cff;
  --neon-cyan: #00f0ff;
  --text-main: #ffffff;
  --glass: rgba(255, 255, 255, 0.03);
  --glass-heavy: rgba(255, 255, 255, 0.08);
  --border: rgba(255, 255, 255, 0.1);
  --nav-bg: rgba(10, 10, 15, 0.9);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Montserrat', sans-serif;
  background-color: var(--bg-dark);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  overflow-x: hidden;
  padding-bottom: 100px;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image: url('stux-live-concert-388160_1920.jpg');
  background-size: cover;
  background-position: center;
  filter: blur(15px) brightness(0.25);
  transform: scale(1.1);
  z-index: -1;
}

.container { width: 92%; max-width: 420px; padding-top: 30px; }

/* HEADER */
.header-brand {
  text-align: center;
  margin-bottom: 30px;
}
.header-brand h2 { 
  font-size: 22px; 
  font-weight: 800; 
  letter-spacing: 6px; 
  background: linear-gradient(to right, #fff, var(--neon-cyan));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.header-brand p { font-size: 10px; color: var(--neon-purple); letter-spacing: 3px; text-transform: uppercase; margin-top: 5px; font-weight: 700; }

/* SEARCH SECTION */
.search-container {
  position: sticky;
  top: 20px;
  z-index: 100;
  margin-bottom: 35px;
}
.search-box {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  backdrop-filter: blur(20px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  transition: 0.3s;
}
.search-box:focus-within {
  border-color: var(--neon-cyan);
  box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
}
.search-box input {
  background: transparent; border: none; color: white; width: 100%; outline: none; font-size: 15px; font-weight: 500;
}

/* SONG CARDS */
.section-label { font-size: 11px; font-weight: 700; letter-spacing: 2px; opacity: 0.4; margin: 0 0 15px 5px; text-transform: uppercase; }

.song-card {
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 15px;
  margin-bottom: 12px;
  transition: 0.2s;
  cursor: pointer;
}
.song-card:active { transform: scale(0.97); background: var(--glass-heavy); }

.song-art { 
  width: 50px; height: 50px; border-radius: 10px; 
  background: linear-gradient(135deg, #1a1a1a, #000); 
  flex-shrink: 0; position: relative; overflow: hidden;
}
.song-art::after { content: "🎵"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; opacity: 0.3; }

.song-meta { flex-grow: 1; }
.song-title { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 2px; }
.song-artist { font-size: 12px; color: rgba(255,255,255,0.5); font-weight: 500; }

.add-btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  color: var(--text-main);
  width: 32px; height: 32px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}

/* PRIORITY SECTION */
.priority-action {
  background: linear-gradient(135deg, rgba(122, 92, 255, 0.15), rgba(0, 240, 255, 0.15));
  border: 1px solid rgba(0, 240, 255, 0.3);
  border-radius: 20px;
  padding: 20px;
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 20px;
  position: relative;
  overflow: hidden;
  animation: pulse 3s infinite;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0px rgba(0, 240, 255, 0); }
  50% { box-shadow: 0 0 20px rgba(0, 240, 255, 0.15); }
  100% { box-shadow: 0 0 0px rgba(0, 240, 255, 0); }
}

.priority-action h4 { font-size: 13px; font-weight: 800; color: var(--neon-cyan); letter-spacing: 1px; }
.priority-action p { font-size: 11px; opacity: 0.6; margin-top: 2px; }
.price-badge { background: var(--neon-cyan); color: #000; padding: 6px 12px; border-radius: 10px; font-weight: 800; font-size: 13px; }

/* NAV */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 85px; background: var(--nav-bg);
  backdrop-filter: blur(30px); border-top: 1px solid var(--border);
  display: flex; justify-content: space-around; align-items: center;
  padding-bottom: 20px; z-index: 1000;
}
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 6px; color: rgba(255,255,255,0.3); text-decoration: none; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
.nav-item.active { color: var(--neon-cyan); }
.nav-icon { font-size: 22px; }

/* MODALS */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 20px; }
.modal { background: #0c0c14; border: 1px solid var(--border); border-radius: 28px; width: 100%; max-width: 360px; padding: 30px; position: relative; }
.modal input { 
  width: 100%; padding: 16px; background: rgba(255,255,255,0.03); 
  border: 1px solid var(--border); color: white; border-radius: 14px; 
  margin-bottom: 12px; outline: none; font-family: inherit;
}
.modal input:focus { border-color: var(--neon-purple); background: rgba(122, 92, 255, 0.05); }

.submit-btn { 
  width: 100%; padding: 18px; border-radius: 14px; border: none; 
  background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan)); 
  color: white; font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;
  cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}

.payment-choice { display: none; flex-direction: column; gap: 12px; margin-top: 5px; }
.pay-btn { 
  padding: 16px; border-radius: 14px; border: 1px solid var(--border); 
  background: rgba(255,255,255,0.05); color: white; font-weight: 700; 
  cursor: pointer; display: flex; align-items: center; justify-content: space-between;
}
.pay-btn:hover { border-color: var(--neon-cyan); background: rgba(0, 240, 255, 0.05); }

/* SUCCESS MODAL */
.success-overlay { position: fixed; inset: 0; background: rgba(5, 5, 7, 0.85); backdrop-filter: blur(25px); display: none; justify-content: center; align-items: center; z-index: 3000; }
.success-card { width: 85%; max-width: 320px; text-align: center; }
.success-icon { font-size: 60px; margin-bottom: 25px; display: block; filter: drop-shadow(0 0 15px var(--neon-cyan)); }
.success-card h2 { font-size: 22px; font-weight: 800; letter-spacing: 2px; margin-bottom: 12px; }
.success-card p { font-size: 14px; line-height: 1.6; opacity: 0.7; font-weight: 500; }
.close-success { margin-top: 40px; background: white; color: black; border: none; padding: 14px 30px; border-radius: 50px; font-size: 12px; font-weight: 800; text-transform: uppercase; cursor: pointer; }

</style>
</head>
<body>

<div class="container">
  <div class="header-brand">
    <h2>ORYX.OS</h2>
    <p id="venueSubtext">LOADING VENUE...</p>
  </div>

  <div class="search-container">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search song or artist...">
    </div>
  </div>

  <div class="section-label" id="listLabel">Top 100 North America</div>
  <div id="songListContainer">
    </div>

  <div class="priority-action" onclick="openModal('', '', 'priority')">
    <div>
      <h4>⚡ SKIP THE QUEUE</h4>
      <p>Priority processing in 10m</p>
    </div>
    <div class="price-badge">$5</div>
  </div>
</div>

<nav class="bottom-nav">
  <a id="navHome" href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span>Home</span></a>
  <a id="navRequest" href="song_request.html" class="nav-item active"><span class="nav-icon">🎵</span><span>Request</span></a>
  <a id="navQueue" href="queue.html" class="nav-item"><span class="nav-icon">📊</span><span>Queue</span></a>
  <a href="admin.html" class="nav-item"><span class="nav-icon">🛡️</span><span>Admin</span></a>
</nav>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle" style="margin-bottom: 25px; text-align: center; letter-spacing: 2px; font-weight: 800;">REQUEST</h3>
    
    <form id="requestForm">
      <div id="formInputs">
        <input type="text" name="song" id="formSong" placeholder="Song Name" required>
        <input type="text" name="artist" id="formArtist" placeholder="Artist" required>
        <input type="text" name="name" id="userName" placeholder="Your Name (Optional)">
        <input type="hidden" id="laneVal" value="free">
        <button type="submit" class="submit-btn" id="mainSubmitBtn">Send Request</button>
      </div>

      <div id="paymentStep" class="payment-choice">
        <button type="button" class="pay-btn" onclick="submitFinalRequest('paypal')"><span>💳 PayPal / Card</span> <span>$5</span></button>
        <button type="button" class="pay-btn" onclick="submitFinalRequest('cash')"><span>💵 Cash at Booth</span> <span>$5</span></button>
      </div>

      <p onclick="closeModal()" style="text-align:center; font-size: 11px; margin-top: 20px; opacity: 0.4; cursor: pointer; font-weight: 700; letter-spacing: 1px;">CANCEL</p>
    </form>
  </div>
</div>

<div class="success-overlay" id="successOverlay">
  <div class="success-card">
    <span class="success-icon" id="successIcon">✨</span>
    <h2 id="successTitle">SENT</h2>
    <p id="successMsg"></p>
    <button class="close-success" onclick="closeSuccess()">Perfect</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyCRzE9DheGAxan7h2NLB14Va3hI4Pc5EKM",
  authDomain: "aryauxsongrequest.firebaseapp.com",
  databaseURL: "https://aryauxsongrequest-default-rtdb.firebaseio.com",
  projectId: "aryauxsongrequest",
  storageBucket: "aryauxsongrequest.firebasestorage.app",
  messagingSenderId: "376455919089",
  appId: "1:376455919089:web:4962df21f4145b61c30050"
});

const db = firebase.database();
const urlParams = new URLSearchParams(window.location.search);
let currentVenue = urlParams.get('v') || "Granville";

document.getElementById('venueSubtext').innerText = currentVenue.replace(/-/g, ' ') + (currentVenue.toLowerCase().includes('warehouse') ? '' : ' Warehouse');
document.getElementById('navHome').href = `index.html?v=${currentVenue}`;
document.getElementById('navRequest').href = `song_request.html?v=${currentVenue}`;
document.getElementById('navQueue').href = `queue.html?v=${currentVenue}`;

// --- CHART DATA ---
const TOP_100 = [
  { title: "Not Like Us", artist: "Kendrick Lamar" },
  { title: "Espresso", artist: "Sabrina Carpenter" },
  { title: "A Bar Song (Tipsy)", artist: "Shaboozey" },
  { title: "Million Dollar Baby", artist: "Tommy Richman" },
  { title: "Beautiful Things", artist: "Benson Boone" },
  { title: "Pink Skies", artist: "Zach Bryan" },
  { title: "Fortnight", artist: "Taylor Swift ft. Post Malone" },
  { title: "Houdini", artist: "Eminem" },
  { title: "Birds of a Feather", artist: "Billie Eilish" },
  { title: "Lose Control", artist: "Teddy Swims" },
  { title: "Like That", artist: "Future & Metro Boomin" },
  { title: "Lunch", artist: "Billie Eilish" },
  { title: "Saturn", artist: "SZA" },
  { title: "Too Sweet", artist: "Hozier" },
  { title: "Austin", artist: "Dasha" }
];

const songListContainer = document.getElementById('songListContainer');
const listLabel = document.getElementById('listLabel');
const searchInput = document.getElementById('searchInput');

function renderSongs(songs, isSearch = false) {
  songListContainer.innerHTML = '';
  listLabel.innerText = isSearch ? "Search Results" : "Top 100 North America";
  
  if (songs.length === 0) {
    songListContainer.innerHTML = '<p style="text-align:center; opacity:0.3; font-size:12px; margin-top:20px;">No matches found.</p>';
    return;
  }

  songs.forEach(song => {
    const card = document.createElement('div');
    card.className = 'song-card';
    card.onclick = () => openModal(song.title, song.artist);
    card.innerHTML = `
      <div class="song-art"></div>
      <div class="song-meta">
        <div class="song-title">${song.title}</div>
        <div class="song-artist">${song.artist}</div>
      </div>
      <div class="add-btn">+</div>
    `;
    songListContainer.appendChild(card);
  });
}

searchInput.oninput = (e) => {
  const query = e.target.value.toLowerCase();
  if (query.length > 0) {
    const filtered = TOP_100.filter(s => 
      s.title.toLowerCase().includes(query) || 
      s.artist.toLowerCase().includes(query)
    );
    renderSongs(filtered, true);
  } else {
    renderSongs(TOP_100.slice(0, 10));
  }
};

// --- MODAL LOGIC ---
function openModal(song = '', artist = '', type = 'free') {
  document.getElementById('overlay').style.display = 'flex';
  document.getElementById('formInputs').style.display = 'block';
  document.getElementById('paymentStep').style.display = 'none';
  document.getElementById('formSong').value = song;
  document.getElementById('formArtist').value = artist;
  document.getElementById('laneVal').value = type;
  document.getElementById('modalTitle').innerText = type === 'priority' ? 'PRIORITY' : 'REQUEST';
}

function closeModal() { document.getElementById('overlay').style.display = 'none'; }

document.getElementById('requestForm').onsubmit = (e) => {
  e.preventDefault();
  const lane = document.getElementById('laneVal').value;
  if (lane === 'priority') {
    document.getElementById('formInputs').style.display = 'none';
    document.getElementById('paymentStep').style.display = 'flex';
  } else {
    submitFinalRequest('free');
  }
};

function submitFinalRequest(method) {
  const lane = document.getElementById('laneVal').value;
  const data = {
    song: document.getElementById('formSong').value,
    artist: document.getElementById('formArtist').value,
    name: document.getElementById('userName').value || "Guest",
    venue: currentVenue,
    lane: lane,
    payment: method,
    status: 'pending',
    timestamp: Date.now()
  };

  db.ref('requests').push(data).then(() => {
    showSuccessMessage(lane, method);
  });
}

function showSuccessMessage(lane, method) {
  const overlay = document.getElementById('successOverlay');
  const msg = document.getElementById('successMsg');
  const icon = document.getElementById('successIcon');
  const prettyVenue = currentVenue.replace(/-/g, ' ');

  if (lane === 'priority') {
    icon.innerText = "⚡";
    msg.innerText = "Priority confirmed. Your request will be live in 10 minutes!";
    overlay.style.display = 'flex';
    if (method === 'paypal') {
      setTimeout(() => { window.location.href = "https://paypal.me/aryaux/5"; }, 3000);
    }
  } else {
    icon.innerText = "🎵";
    msg.innerText = `Thank you for requesting at ${prettyVenue}! If our DJ has the track, it's going on.`;
    overlay.style.display = 'flex';
  }
}

function closeSuccess() {
  document.getElementById('successOverlay').style.display = 'none';
  closeModal();
}

// Initial Load
renderSongs(TOP_100.slice(0, 10));
</script>
</body>
</html>
