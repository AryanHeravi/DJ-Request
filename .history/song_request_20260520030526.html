<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>ORYX.OS | Request</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg-dark: #050507;
  --neon-purple: #7a5cff;
  --neon-cyan: #00f0ff;
  --neon-pink: #ff2fd1;
  --text-main: #ffffff;
  --glass: rgba(255, 255, 255, 0.03);
  --border: rgba(255, 255, 255, 0.1);
  --nav-bg: rgba(10, 10, 15, 0.95);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Montserrat', sans-serif;
  background-color: var(--bg-dark);
  color: var(--text-main);
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  position: relative; overflow-x: hidden; padding-bottom: 110px;
}

body::before {
  content: ""; position: fixed; inset: 0;
  background: radial-gradient(circle at top right, #1a1a2e, #050507);
  z-index: -2;
}

.container { width: 92%; max-width: 420px; padding-top: 30px; transition: filter 0.4s ease; }

.header-brand { text-align: center; margin-bottom: 30px; }
.header-brand h2 { 
  font-size: 24px; font-weight: 800; letter-spacing: 8px; 
  background: linear-gradient(to right, #fff, var(--neon-cyan));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.header-brand p { font-size: 10px; color: var(--neon-purple); letter-spacing: 4px; text-transform: uppercase; margin-top: 5px; font-weight: 700; }

.search-wrapper { position: sticky; top: 20px; z-index: 1000; margin-bottom: 25px; }
.search-box {
  background: rgba(20, 20, 25, 0.85); border: 1px solid var(--border);
  border-radius: 16px; padding: 16px 20px; display: flex; align-items: center;
  backdrop-filter: blur(25px); box-shadow: 0 15px 35px rgba(0,0,0,0.6);
}
.search-box input { background: transparent; border: none; color: white; width: 100%; outline: none; font-size: 15px; font-weight: 500; }
.search-box input:disabled { opacity: 0.3; cursor: not-allowed; }

.search-results-dropdown {
  position: absolute; top: calc(100% + 10px); left: 0; right: 0;
  background: rgba(15, 15, 23, 0.95); border: 1px solid var(--border); border-radius: 20px;
  max-height: 320px; overflow-y: auto; display: none;
  box-shadow: 0 25px 50px rgba(0,0,0,0.9); z-index: 1001; backdrop-filter: blur(20px);
}

.manual-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 30px; }
.manual-card {
  padding: 18px; border-radius: 18px; border: 1px solid var(--border);
  background: var(--glass); text-align: center; cursor: pointer;
  transition: opacity 0.3s;
}
.manual-card i { font-size: 22px; display: block; margin-bottom: 8px; }
.manual-card span { font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
.manual-card.prio { border-color: var(--neon-cyan); background: rgba(0, 240, 255, 0.05); }
.manual-card.disabled-card { opacity: 0.2; cursor: not-allowed; pointer-events: none; border-color: rgba(255,255,255,0.05) !important; background: transparent !important; }

.section-label { font-size: 11px; font-weight: 700; letter-spacing: 2.5px; opacity: 0.5; margin: 0 0 15px 8px; text-transform: uppercase; }
.song-card {
  background: var(--glass); border: 1px solid var(--border); border-radius: 20px;
  padding: 14px 16px; display: flex; align-items: center; gap: 16px; margin-bottom: 12px; cursor: pointer;
}
.song-art { width: 48px; height: 48px; border-radius: 12px; background: #1a1a24; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.song-meta { flex-grow: 1; overflow: hidden; }
.song-title { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song-artist { font-size: 12px; opacity: 0.5; }

.lock-banner {
  background: rgba(255, 47, 209, 0.08);
  border: 1px solid var(--neon-pink);
  color: #fff;
  border-radius: 16px;
  padding: 15px;
  margin-bottom: 25px;
  font-size: 12px;
  text-align: center;
  font-weight: 600;
  letter-spacing: 0.5px;
  display: none;
  animation: pulseGlow 2s infinite alternate;
}

@keyframes pulseGlow {
  from { box-shadow: 0 0 5px rgba(255, 47, 209, 0.2); }
  to { box-shadow: 0 0 15px rgba(255, 47, 209, 0.4); }
}

.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 20px; }
.modal { background: #0c0c14; border: 1px solid var(--border); border-radius: 32px; width: 100%; max-width: 380px; padding: 35px; }
.modal input, .modal textarea { 
  width: 100%; padding: 18px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); 
  color: white; border-radius: 16px; margin-bottom: 14px; outline: none; font-family: inherit; font-size: 14px;
}
.modal textarea { height: 80px; resize: none; }
.submit-btn { width: 100%; padding: 20px; border-radius: 16px; border: none; background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan)); color: white; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }

.success-overlay {
  position: fixed; inset: 0; background: rgba(5, 5, 7, 0.4); backdrop-filter: blur(40px);
  display: none; flex-direction: column; justify-content: center; align-items: center;
  z-index: 3000; text-align: center; padding: 40px;
}
.success-msg-box { max-width: 300px; }
.success-icon { font-size: 50px; margin-bottom: 20px; display: block; filter: drop-shadow(0 0 10px var(--neon-cyan)); }
.success-title { font-size: 20px; font-weight: 800; letter-spacing: 3px; margin-bottom: 15px; text-transform: uppercase; }
.success-text { font-size: 14px; line-height: 1.6; opacity: 0.8; font-weight: 500; }
.done-btn { margin-top: 40px; background: white; color: black; border: none; padding: 15px 40px; border-radius: 50px; font-weight: 800; font-size: 12px; text-transform: uppercase; cursor: pointer; }

.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 90px; background: var(--nav-bg); backdrop-filter: blur(35px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; padding-bottom: 25px; z-index: 999; }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 6px; color: rgba(255,255,255,0.3); text-decoration: none; font-size: 11px; font-weight: 700; cursor: pointer; }
.nav-item.active { color: var(--neon-cyan); }
</style>
</head>
<body>

<div class="container" id="mainApp">
  <div class="header-brand">
    <img src="/photos/wg-1logo.png" id="venueLogo" class="main-logo" alt="Venue Logo" style="width: 80px; margin-bottom: 15px;">
    <h2>ORYX.OS</h2>
    <p id="venueDisplay">Loading Venue...</p>
  </div>

  <div class="lock-banner" id="boothLockedBanner">
    🛑 THE BOOTH IS CURRENTLY SLAMMED<br>
    <span style="font-size:10px; opacity:0.7; font-weight:400;">Standard requests are paused. Check back shortly!</span>
  </div>

  <div class="search-wrapper">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Initializing engine..." autocomplete="off">
    </div>
    <div class="search-results-dropdown" id="dropdownList"></div>
  </div>

  <div class="section-label">Manual Add</div>
  <div class="manual-grid">
    <div class="manual-card" id="manualCardFree" onclick="openModal('', '', 'free')"><i>🎵</i><span>Free</span></div>
    <div class="manual-card prio" id="manualCardPrio" onclick="openModal('', '', 'priority')"><i>⚡</i><span>Priority</span></div>
  </div>

  <div class="section-label">Trending Now</div>
  <div id="mainChartList"></div>
</div>

<nav class="bottom-nav">
  <div class="nav-item" onclick="navigate('index.html')"><span>🏠</span><span>Home</span></div>
  <div class="nav-item active"><span>🎵</span><span>Request</span></div>
  <div class="nav-item" onclick="navigate('queue.html')"><span>📊</span><span>Queue</span></div>
  <div class="nav-item" onclick="navigate('admin.html')"><span>⚙️</span><span>Admin</span></div>
</nav>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle" style="margin-bottom: 25px; text-align: center; letter-spacing: 3px; font-weight: 800;">REQUEST</h3>
    <form id="requestForm">
      <div id="formInputs">
        <input type="text" id="formSong" placeholder="Song Name" required>
        <input type="text" id="formArtist" placeholder="Artist" required>
        <textarea id="userNote" placeholder="Add a note for the DJ..."></textarea>
        <input type="text" id="userName" placeholder="Your Name (Optional)">
        <input type="hidden" id="laneVal" value="free">
        <button type="submit" class="submit-btn">Send Request</button>
      </div>
      
      <div id="paymentStep" style="display:none; flex-direction: column; gap: 12px;">
         <button type="button" class="submit-btn" style="background: #0070ba;" id="paypalBtn" onclick="submitFinalRequest('paypal')">PayPal • $5.00</button>
         <button type="button" class="submit-btn" style="background: #2e2e2e;" id="cashBtn" onclick="submitFinalRequest('cash')">Pay at Booth • $5.00</button>
      </div>
      <p onclick="closeModal()" style="text-align:center; font-size: 11px; margin-top: 25px; opacity: 0.4; cursor: pointer;">CANCEL</p>
    </form>
  </div>
</div>

<div class="success-overlay" id="successOverlay">
  <div class="success-msg-box">
    <span class="success-icon" id="sIcon">✨</span>
    <h2 class="success-title" id="sTitle">SENT</h2>
    <p class="success-text" id="sText"></p>
    <button class="done-btn" onclick="resetApp()">Return to OS</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCRzE9DheGAxan7h2NLB14Va3hI4Pc5EKM",
  authDomain: "aryauxsongrequest.firebaseapp.com",
  databaseURL: "https://aryauxsongrequest-default-rtdb.firebaseio.com",
  projectId: "aryauxsongrequest",
  storageBucket: "aryauxsongrequest.firebasestorage.app",
  messagingSenderId: "376455919089",
  appId: "1:376455919089:web:4962df21f4145b61c30050"
});

const db = firebase.database();
const fs = firebase.firestore();

const urlParams = new URLSearchParams(window.location.search);
const currentVenue = urlParams.get('v') || "Granville Warehouse";
document.getElementById('venueDisplay').innerText = currentVenue.toUpperCase();

function navigate(page) {
  window.location.href = `${page}?v=${encodeURIComponent(currentVenue)}`;
}

let dynamicPriorityFee = 5.00;
let localPriorityFee = 5.00;
let baseQueueAcceptingState = true;
let networkFreezeActive = false;
let globalMultiplierActive = false;

function getCleanVenueKey(venueName) {
  if (!venueName) return 'granville warehouse';
  const clean = venueName.toLowerCase().trim();
  if (clean.includes('granville')) return 'granville warehouse';
  if (clean.includes('victoria')) return 'victoria';
  if (clean.includes('whistler')) return 'whistler';
  if (clean.includes('dime')) return 'dime';
  if (clean.includes('bloor')) return 'bloor';
  if (clean.includes('london')) return 'london';
  if (clean.includes('ottawa')) return 'ottawa';
  if (clean.includes('yonge')) return 'yonge';
  if (clean.includes('queen')) return 'queen';
  if (clean.includes('montreal') || clean.includes('warehouse-mtl')) return 'warehouse-mtl';
  if (clean.includes('entrepot') || clean.includes('l-entrepot')) return 'l-entrepot';
  if (clean.includes('st-laurent') || clean.includes('st.laurent')) return 'st-laurent';
  if (clean.includes('bureau-qc')) return 'bureau-qc';
  if (clean.includes('bureau-tr')) return 'bureau-tr';
  if (clean.includes('calgary')) return 'calgary';
  if (clean.includes('edmonton')) return 'edmonton';
  if (clean.includes('thomas')) return 'thomas';
  return clean;
}

// Evaluate layout view restrictions state clearly
function applyCalculatedLockStates() {
  const banner = document.getElementById('boothLockedBanner');
  const inputField = document.getElementById('searchInput');
  const freeCard = document.getElementById('manualCardFree');
  const prioCard = document.getElementById('manualCardPrio');

  if (networkFreezeActive) {
    banner.style.display = 'block';
    banner.innerHTML = `⚠️ NETWORK-WIDE SYSTEM LOCK<br><span style="font-size:10px; opacity:0.7; font-weight:400;">Submissions are temporarily disabled by HQ.</span>`;
    freeCard.classList.add('disabled-card');
    prioCard.classList.add('disabled-card');
    if (inputField) {
      inputField.disabled = true;
      inputField.placeholder = "System maintenance lock active...";
    }
  } else if (!baseQueueAcceptingState) {
    banner.style.display = 'block';
    banner.innerHTML = `🛑 THE BOOTH IS CURRENTLY SLAMMED<br><span style="font-size:10px; opacity:0.7; font-weight:400;">Standard requests are paused. Check back shortly!</span>`;
    freeCard.classList.add('disabled-card');
    prioCard.classList.remove('disabled-card');
    if (inputField) {
      inputField.disabled = false;
      inputField.placeholder = "Search tracks (Priority lane open)...";
    }
  } else {
    banner.style.display = 'none';
    freeCard.classList.remove('disabled-card');
    prioCard.classList.remove('disabled-card');
    if (inputField && !inputField.hasAttribute('data-loading')) {
      inputField.disabled = false;
      inputField.placeholder = fullLibrary.length ? `Search ${fullLibrary.length.toLocaleString()} tracks...` : "Search tracks...";
    }
  }
}

function recalculatePriorityDisplay() {
  dynamicPriorityFee = globalMultiplierActive ? (localPriorityFee * 1.5) : localPriorityFee;
  const formattedFee = dynamicPriorityFee.toFixed(2);
  
  document.getElementById('paypalBtn').innerText = `PayPal • $${formattedFee}`;
  document.getElementById('cashBtn').innerText = `Pay at Booth • $${formattedFee}`;
  
  const label = document.getElementById('manualCardPrio').querySelector('span');
  if (label) {
    label.innerText = globalMultiplierActive ? "Priority ⚡ SURGE" : "Priority";
  }
}


function initSettingsSessionSync() {
  const cleanKey = getCleanVenueKey(currentVenue);
  
  // 1. Live Local Venue Status Toggles
  db.ref(`status/${cleanKey}/accepting_requests`).on('value', snap => {
    baseQueueAcceptingState = snap.val() !== false;
    applyCalculatedLockStates();
  });

  // 2. Live Local Dynamic Pricing Shifts
  db.ref(`status/${cleanKey}/priority_fee`).on('value', snap => {
    if (snap.exists()) {
      localPriorityFee = parseFloat(snap.val());
      recalculatePriorityDisplay();
    }
  });

  // 3. MASTER HQ OVERRIDE: EMERGENCY FREEZE
  db.ref('settings/global/freeze').on('value', snap => {
    networkFreezeActive = snap.val() === true;
    applyCalculatedLockStates();
  });

  // 4. MASTER HQ OVERRIDE: VIP MULTIPLIER SURGE
  db.ref('settings/global/multiplier').on('value', snap => {
    globalMultiplierActive = snap.val() === true;
    recalculatePriorityDisplay();
  });

  // 5. MASTER HQ OVERRIDE: DYNAMIC LIVE BROADCAST TICKER
  db.ref('settings/global/broadcast').on('value', snap => {
    if (snap.exists()) {
      const data = snap.val();
      if (Date.now() - data.timestamp < 14400000) { // 4 Hour expiration
        let broadcastTicker = document.getElementById('systemBroadcastTicker');
        if (!broadcastTicker) {
          broadcastTicker = document.createElement('div');
          broadcastTicker.id = 'systemBroadcastTicker';
          broadcastTicker.style.cssText = "width:100%; background:linear-gradient(90deg, var(--neon-purple), var(--neon-pink)); color:white; padding:10px; font-size:11px; font-weight:800; text-align:center; letter-spacing:1px; position:fixed; top:0; left:0; z-index:9999; text-transform:uppercase;";
          document.body.appendChild(broadcastTicker);
          document.body.style.paddingTop = "40px";
        }
        broadcastTicker.innerText = `📢 NETWORK ALERT: ${data.message}`;
      }
    }
  });
}

let fullLibrary = [];
let fuse;

function loadLibrary() {
  const searchInput = document.getElementById('searchInput');
  searchInput.placeholder = "Syncing with ORYX.OS...";
  searchInput.disabled = true;
  searchInput.setAttribute('data-loading', 'true');

  fs.collection('songlibrary').get().then((querySnapshot) => {
    fullLibrary = querySnapshot.docs.map((doc) => {
      const data = doc.data();
      return {
        title: data['Title'] || data['songTitle'] || data['title'] || data['SongTitle'] || data['Track'] || data['Name'] || "Unknown",
        artist: data['Artist'] || data['artist'] || data['ArtistName'] || data['Artist Name'] || "Unknown"
      };
    });
    
    searchInput.removeAttribute('data-loading');
    applyCalculatedLockStates();

    fuse = new Fuse(fullLibrary, {
      keys: ['title', 'artist'],
      threshold: 0.35,
      distance: 100,
      minMatchCharLength: 2
    });
  }).catch(() => {
    searchInput.placeholder = "Error: Connection Failed";
  });
}

function loadTrending() {
  db.ref('requests').limitToLast(100).on('value', (snapshot) => {
    const allRequests = snapshot.val();
    if (!allRequests) return;

    const counts = {};
    const targetVenueClean = getCleanVenueKey(currentVenue);

    Object.values(allRequests).forEach(req => {
      if (req.song && req.artist && getCleanVenueKey(req.venue) === targetVenueClean) {
        const key = `${req.song.trim()}|${req.artist.trim()}`;
        counts[key] = (counts[key] || 0) + 1;
      }
    });

    const sorted = Object.keys(counts)
      .map(key => {
        const [title, artist] = key.split('|');
        return { title, artist, count: counts[key] };
      })
      .sort((a, b) => b.count - a.count)
      .slice(0, 5);

    renderTrending(sorted);
  });
}

function renderTrending(songs) {
  const mainChart = document.getElementById('mainChartList');
  mainChart.innerHTML = ''; 
  
  if (songs.length === 0) {
    mainChart.innerHTML = `<div style="padding:15px; font-size:11px; opacity:0.4; text-align:center;">No tracks trending at this venue yet tonight.</div>`;
    return;
  }

  songs.forEach(song => {
    const card = createSongCard(song);
    const badge = document.createElement('span');
    badge.style.cssText = "font-size: 10px; color: var(--neon-cyan); margin-left: auto; font-weight: 800; padding-right: 5px;";
    badge.innerText = `${song.count} REQS`;
    card.appendChild(badge);
    mainChart.appendChild(card);
  });
}

const searchInputInput = document.getElementById('searchInput');
const dropdown = document.getElementById('dropdownList');

function createSongCard(song, isDropdown = false) {
  const div = document.createElement('div');
  div.className = `song-card ${isDropdown ? 'dropdown-item' : ''}`;
  div.onclick = () => {
    if(networkFreezeActive) {
      alert("Submissions are currently locked down network-wide by HQ.");
      return;
    }
    if(!baseQueueAcceptingState) {
      openModal(song.title, song.artist, 'priority');
    } else {
      openModal(song.title, song.artist, 'free'); 
    }
    dropdown.style.display = 'none';
    searchInputInput.value = '';
  };
  div.innerHTML = `<div class="song-art">💿</div><div class="song-meta"><div class="song-title">${song.title}</div><div class="song-artist">${song.artist}</div></div>`;
  return div;
}

searchInputInput.addEventListener('input', (e) => {
  const val = e.target.value;
  dropdown.innerHTML = '';
  
  if (val.length > 2) { 
    if (fuse) {
      const results = fuse.search(val).slice(0, 10);
      if (results.length > 0) {
        results.forEach(r => dropdown.appendChild(createSongCard(r.item, true)));
        dropdown.style.display = 'block';
      } else { dropdown.style.display = 'none'; }
    }
  } else { dropdown.style.display = 'none'; }
});

document.addEventListener('click', (e) => { 
  if (!e.target.closest('.search-wrapper')) dropdown.style.display = 'none'; 
});

function openModal(s='', a='', type='free') {
  if (networkFreezeActive) {
    alert("HQ Master System Lock is engaged. Submissions cannot be accepted.");
    return;
  }
  if (type === 'free' && !baseQueueAcceptingState) {
    alert("Standard request access is locked. Use Priority Lane to request songs.");
    return;
  }
  
  document.getElementById('overlay').style.display = 'flex';
  document.getElementById('formInputs').style.display = 'block';
  document.getElementById('paymentStep').style.display = 'none';
  document.getElementById('formSong').value = s;
  document.getElementById('formArtist').value = a;
  document.getElementById('laneVal').value = type;
  document.getElementById('modalTitle').innerText = type === 'priority' ? '⚡ PRIORITY' : '🎵 REQUEST';
}

function closeModal() { document.getElementById('overlay').style.display = 'none'; }

document.getElementById('requestForm').onsubmit = function(e) {
  e.preventDefault();
  const lane = document.getElementById('laneVal').value;
  if (lane === 'priority') {
    document.getElementById('formInputs').style.display = 'none';
    document.getElementById('paymentStep').style.display = 'flex';
  } else {
    submitFinalRequest('none');
  }
};

function submitFinalRequest(method) {
  const lane = document.getElementById('laneVal').value;
  const data = {
    song: document.getElementById('formSong').value,
    artist: document.getElementById('formArtist').value,
    note: document.getElementById('userNote').value || "",
    name: document.getElementById('userName').value || "Guest",
    venue: currentVenue,
    lane: lane,
    payment: method,
    status: 'pending',
    timestamp: Date.now()
  };

  db.ref('requests').push(data).then(() => {
    showFormalMessage(lane);
  }).catch(err => alert("DB Error: " + err.message));
}

function showFormalMessage(lane) {
  const overlay = document.getElementById('successOverlay');
  const mainApp = document.getElementById('mainApp');
  mainApp.style.filter = "blur(30px)";
  closeModal();
  
  const title = document.getElementById('sTitle');
  const text = document.getElementById('sText');
  const icon = document.getElementById('sIcon');

  if (lane === 'priority') {
    icon.innerText = "⚡";
    title.innerText = "PRIORITY ACTIVE";
    text.innerText = "Thank you! Song passed to priority processing cue lines.";
  } else {
    icon.innerText = "🎵";
    title.innerText = "REQUEST SENT";
    text.innerText = "Sent to the DJ booth. Stay tuned!";
  }
  overlay.style.display = 'flex';
}

function resetApp() {
  document.getElementById('successOverlay').style.display = 'none';
  document.getElementById('mainApp').style.filter = "none";
  document.getElementById('requestForm').reset();
}

initSettingsSessionSync();
loadLibrary();
loadTrending();
</script>
</body>
</html>
